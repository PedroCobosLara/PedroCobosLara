<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Pedro Cobos Lara, desarrollador de aplicaciones web" xmlns:c2pa="http://c2pa.org/manifest">
<style>
@media (prefers-reduced-motion: no-preference) {
  .fade { animation: fade .9s ease-out both; }
  .d1 { animation-delay: .1s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .5s; } .d4 { animation-delay: .7s; }
  .halo { transform-box: fill-box; transform-origin: center; animation: halo 2.6s ease-out infinite; }
  .o1 { transform-origin: 790px 150px; animation: spin 24s linear infinite; }
  .o2 { transform-origin: 790px 150px; animation: spin 38s linear infinite reverse; }
  .o3 { transform-origin: 790px 150px; animation: spin 56s linear infinite; }
  .core { transform-box: fill-box; transform-origin: center; animation: breathe 5s ease-in-out infinite; }
  .tw { animation: tw 3.6s ease-in-out infinite; }
  .glow { animation: drift 9s ease-in-out infinite alternate; }
}
@keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes halo { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(2.8); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
@keyframes drift { from { opacity: .7; } to { opacity: 1; } }
</style>
